
services:
  api:
    build:
      context: ./ClientesAPI/ClientesAPI
      dockerfile: Dockerfile
    image: api-clientes
    container_name: api-clientes
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${SQL_CONNECTION_STRING}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontendClientes
      dockerfile: Dockerfile
    image: node-clientes
    container_name: node-clientes
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080/api/Clientes
    depends_on:
      - api
    restart: unless-stopped
